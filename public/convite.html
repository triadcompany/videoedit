<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Criar acesso · Variações de Criativo</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d0f13; --surface:#181c22; --field:#0f1216; --line:#272d36; --line-2:#363e4a;
    --text:#eceff4; --text-2:#aab2bf; --text-3:#8790a0;
    --accent:#6b5bf5; --accent-lo:#5a4be0; --accent-hi:#a59bff; --err:#ff7a7a; --err-soft:rgba(255,122,122,.13);
    --font:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased }
  ::selection { background:rgba(135,120,255,.45); color:#fff }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px }
  main { width:100%; max-width:400px }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px }
  .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:var(--accent-lo); color:#fff }
  .mark svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .brand b { font-size:16px; font-weight:600; letter-spacing:-.01em }
  h1 { margin:0 0 4px; font-size:24px; font-weight:600; letter-spacing:-.015em }
  .lead { margin:0 0 22px; color:var(--text-3) }
  form { display:grid; gap:16px; padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--surface) }
  label { display:grid; gap:6px; font-size:13px; color:var(--text-2); font-weight:500 }
  input { width:100%; min-height:42px; padding:0 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--field); color:var(--text); font:inherit; caret-color:var(--accent-hi); transition:border-color .15s }
  input:hover:not([readonly]) { border-color:var(--text-3) }
  input[readonly] { color:var(--text-2); background:transparent }
  small { color:var(--text-3); font-weight:400 }
  button.go { min-height:44px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:15px; cursor:pointer; transition:background-color .15s }
  button.go:hover:not(:disabled) { background:var(--accent-lo) }
  button.go:disabled { opacity:.55; cursor:progress }
  .err { display:none; padding:10px 12px; border-radius:9px; background:var(--err-soft); color:var(--err); font-size:13.5px }
  .err.show { display:block }
  .box { padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--surface) }
  .box p { margin:0 0 14px; color:var(--text-2) }
  a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 18px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600 }
  [hidden] { display:none !important }
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M10 9.2v5.6l4.6-2.8z"/></svg></span>
    <b>Variações de Criativo</b>
  </div>

  <div id="loading" class="lead">Conferindo o convite…</div>

  <div id="bad" hidden>
    <h1>Convite inválido</h1>
    <div class="box"><p id="badmsg">Este convite não vale mais. Peça um novo ao administrador.</p><a class="btn" href="/login">Ir para o login</a></div>
  </div>

  <div id="ok" hidden>
    <h1>Criar seu acesso</h1>
    <p class="lead">Você foi convidado. Escolha uma senha para entrar.</p>
    <form id="f" novalidate>
      <label>E-mail <input id="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Senha <small>mínimo de 8 caracteres</small> <input id="pw" type="password" autocomplete="new-password"></label>
      <label>Repita a senha <input id="pw2" type="password" autocomplete="new-password"></label>
      <div class="err" id="err" role="alert"></div>
      <button class="go" id="go" type="submit">Criar acesso e entrar</button>
    </form>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const token = location.pathname.split("/").pop();
  (async () => {
    try {
      const r = await fetch("/api/invite/" + encodeURIComponent(token));
      const j = await r.json();
      if (!r.ok) { $("#badmsg").textContent = j.error || "Este convite não vale mais."; $("#bad").hidden = false; }
      else {
        if (j.email) { $("#email").value = j.email; $("#email").readOnly = true; }   // convite reservado para um e-mail
        $("#ok").hidden = false;
        (j.email ? $("#pw") : $("#email")).focus();
      }
    } catch { $("#badmsg").textContent = "Não foi possível conferir o convite. Tente de novo."; $("#bad").hidden = false; }
    $("#loading").hidden = true;
  })();
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#err"), go = $("#go");
    const fail = (m) => { err.textContent = m; err.classList.add("show"); };
    err.classList.remove("show");
    if (!$("#email").value.trim()) return fail("Digite o seu e-mail.");
    if ($("#pw").value.length < 8) return fail("A senha precisa ter pelo menos 8 caracteres.");
    if ($("#pw").value !== $("#pw2").value) return fail("As duas senhas não são iguais.");
    go.disabled = true; go.textContent = "Criando…";
    try {
      const r = await fetch("/api/invite/accept", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, email: $("#email").value, password: $("#pw").value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Não foi possível criar o acesso.");
      location.replace("/");
    } catch (x) { fail(x.message); go.disabled = false; go.textContent = "Criar acesso e entrar"; }
  });
</script>
</body>
</html>
